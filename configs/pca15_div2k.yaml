# Fit PCA-15 on the same DIV2K training images as the original PCA-8 config.
model:
  scale: 4
  rank: 15
data:
  train_dataset: div2k
  train_hr: /home/admin_mcn/scdc_data/data_bundle/phase1_seven_extra/div2k_train/DIV2K_train_HR
