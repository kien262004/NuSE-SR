[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullspaceSR"
version = "0.1.0"
description = "Direct block-null-space PCA super-resolution research scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "Pillow>=9.1", "PyYAML>=6.0"]

[project.optional-dependencies]
research = ["matplotlib>=3.7"]
metrics = ["lpips>=0.1.4"]
wandb = ["wandb>=0.17"]

[project.scripts]
nusesr-fit-pca = "nullspaceSR.fit_pca:main"
nusesr-train = "train:main"
nusesr-test = "test:main"
nusesr-research = "nullspaceSR.analysis.research:main"

[tool.setuptools]
py-modules = ["train", "test"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nullspaceSR*"]
