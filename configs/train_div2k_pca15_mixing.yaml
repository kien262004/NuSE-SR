# Match configs/train_div2k.yaml except for the PCA-15→8 decoder and its LR group.
model:
  null_space: true
  basis_mode: pca_mixing
  source_rank: 15
  scale: 4
  rank: 8
  width: 64
  basis: basis/avgpool_x4_rank15.pt
  checkpoint: runs/nusesr_x4_pca15_mixing/best.pt
data:
  train_dataset: div2k
  val_dataset: div2k
  test_dataset: div2k
  train_hr: /home/admin_mcn/scdc_data/data_bundle/phase1_seven_extra/div2k_train/DIV2K_train_HR
  val_hr: /home/admin_mcn/scdc_data/data_bundle/phase1_seven_extra/div2k_valid/DIV2K_valid_HR
  hr_dir: /home/admin_mcn/scdc_data/data_bundle/phase1_seven_extra/div2k_valid/DIV2K_valid_HR
  resize:
    method: average_pool
    size: [64, 64]
    antialias: true
  val_dataset_options:
    resize:
      size: null
  test_dataset_options:
    resize:
      size: null
  crop_size: 256
  repeat: 20
  augment: true
  workers: 0
train:
  output: runs/nusesr_x4_pca15_mixing
  epochs: 100
  batch_size: 128
  lr: 0.001
  min_lr: 1.0e-06
  basis_lr: 0.0001
  basis_min_lr: 1.0e-07
  weight_decay: 0.0
  grad_clip: 1.0
  val_every: 1
  log_every: 100
  checkpoint_every: 10
evaluation:
  lpips: true
  output: results/nusesr_x4_pca15_mixing_validation
  shave: 0
  save_images: false
runtime:
  device: auto
  seed: 2026
logging:
  enabled: true
  project: NuSE-SR
  mode: online
  tags: [div2k, x4, pca15-mixing]
