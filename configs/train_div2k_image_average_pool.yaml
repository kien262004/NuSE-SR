# Shared experiment config: model, data, train, plus PCA/evaluation/runtime.
# Image-space IMDN with average-pool LR inputs; no PCA fitting required.
model:
  null_space: false
  channels: 3
  scale: 4
  rank: 8
  width: 64
  checkpoint: runs/imdn_x4_average_pool/best.pt
data:
  train_dataset: div2k
  val_dataset: div2k
  test_dataset: div2k
  train_hr: /home/admin_mcn/scdc_data/data_bundle/phase1_seven_extra/div2k_train/DIV2K_train_HR
  val_hr: /home/admin_mcn/scdc_data/data_bundle/phase1_seven_extra/div2k_valid/DIV2K_valid_HR
  hr_dir: /home/admin_mcn/scdc_data/data_bundle/phase1_seven_extra/div2k_valid/DIV2K_valid_HR
  resize:
    method: average_pool
    size:
    - 64
    - 64
    antialias: true
  val_dataset_options:
    resize:
      size: null
  test_dataset_options:
    resize:
      size: null
  crop_size: 256
  repeat: 20
  augment: true
  workers: 0
train:
  output: runs/imdn_x4_average_pool
  epochs: 100
  batch_size: 128
  lr: 0.001
  min_lr: 1.0e-06
  weight_decay: 0.0
  grad_clip: 1.0
  val_every: 1
  log_every: 100
  checkpoint_every: 10
pca:
  output: basis/avgpool_x4_rank8.pt
  batch_size: 8
  repeat: 4
  augment: false
evaluation:
  output: results/imdn_x4_average_pool_validation
  shave: 0
  save_images: false
runtime:
  device: auto
  seed: 2026
logging:
  enabled: true
  project: NuSE-SR
  mode: online
  tags: [div2k, x4, average_pool, image_space]
